name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publication-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_publication.py --ref HEAD

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run

  backend-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - run: ../.venv/bin/python -m pytest tests/portfolio tests/evals/backend -q
        working-directory: backend
      - run: ../.venv/bin/python -m pytest tests/evals/chat -q
        working-directory: backend
      - run: ../.venv/bin/python -m pytest tests/test_publication_safety.py tests/test_provider_credentials.py tests/test_chat_provider.py tests/test_config_secrets.py -q
        working-directory: backend
